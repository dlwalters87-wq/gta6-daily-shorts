
name: GTA 6 Daily News Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate GTA 6 Shorts drafts
        run: python news_generator.py

      - name: Generate AI voiceovers
        run: python voice_generator.py

      - name: Save scripts to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if ! git diff --cached --quiet; then
            git commit -m "Update GTA 6 daily drafts"
            git push
          fi

      - name: Save voiceovers for review
        uses: actions/upload-artifact@v4
        with:
          name: gta6-daily-voiceovers
          path: audio/
          if-no-files-found: warn
          retention-days: 7
