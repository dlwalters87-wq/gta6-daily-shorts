
name: GTA 6 Daily News Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate GTA 6 Shorts drafts
        run: python news_generator.py

      - name: Save drafts for review
        uses: actions/upload-artifact@v4
        with:
          name: gta6-daily-drafts
          path: output/
          retention-days: 7
